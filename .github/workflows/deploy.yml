# The pipeline this site's ops panel reports on. Every step here is real:
# if lint or tests fail, nothing deploys. Deploys are prebuilt in CI and
# pushed to Vercel, so Vercel's own git integration stays disabled.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      # Pinned so pull/build/deploy all run the exact same CLI. 54.20.1 (latest)
      # has a prebuilt-deploy regression: the server-side processor fails with
      # ENOENT on .vercel/output/builds.json. 54.6.1 predates it.
      - name: install vercel cli
        run: npm install --global vercel@54.6.1

      - name: lint
        run: npm run lint

      # JSON reporter feeds real test counts into the ops panel via
      # scripts/build-info.mjs (runs as prebuild inside `vercel build`).
      - name: test
        run: npx vitest run --reporter=default --reporter=json --outputFile=test-results.json

      - name: pull vercel config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --archive=tgz uploads the build output as a single tarball. Per-file
      # uploads were silently dropping .vercel/output/builds.json, making the
      # deployment fail server-side with ENOENT on that file.
      - name: deploy
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
