# The pipeline this site's ops panel reports on. Every step here is real:
# if lint or tests fail, nothing deploys. Actions is the only thing allowed
# to trigger a deploy; Vercel builds the exact commit the gate approved.
# (Prebuilt CI deploys are disabled for now: Vercel's prebuilt ingestion
# currently fails server-side with ENOENT on .vercel/output/builds.json,
# reproduced across CLI 54.6.1/54.20.1, fresh projects, and archive mode.)
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      # Pinned so every run uses a known CLI.
      - name: install vercel cli
        run: npm install --global vercel@54.6.1

      - name: lint
        run: npm run lint

      # JSON reporter captures real test counts; the deploy step forwards
      # them into the Vercel build so scripts/build-info.mjs bakes them
      # into the artifact (shown in the ops panel).
      - name: test
        run: npx vitest run --reporter=default --reporter=json --outputFile=test-results.json

      - name: deploy
        run: |
          TESTS_TOTAL=$(node -p "require('./test-results.json').numTotalTests")
          TESTS_PASSED=$(node -p "require('./test-results.json').numPassedTests")
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} \
            --build-env GITHUB_ACTIONS=true \
            --build-env GITHUB_SHA=${{ github.sha }} \
            --build-env GITHUB_REF_NAME=${{ github.ref_name }} \
            --build-env GITHUB_RUN_NUMBER=${{ github.run_number }} \
            --build-env TESTS_TOTAL=$TESTS_TOTAL \
            --build-env TESTS_PASSED=$TESTS_PASSED
